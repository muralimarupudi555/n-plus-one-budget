# The gate. It runs what `make verify` runs, against the same pinned database, so a green
# tick here and a green run locally mean the same thing.
#
# The experiments are not run here. Their timings depend on a simulated round trip that a
# busy shared runner would distort, and a benchmark that fails on infrastructure noise
# teaches everyone to re-run the job until it goes green. What CI does instead is re-derive
# the query counts from theory.py and check the committed results against them, which is a
# claim that holds on any machine - the whole point being that a query count is the same
# integer everywhere and a time is not.
name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      NPLUSONE_DSN: postgresql://postgres:postgres@127.0.0.1:5433/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # First, and before anything is installed: a workflow that names a file which is
      # not in the repository fails on a step nothing local ever runs. This repository
      # learned that the hard way.
      - name: The workflow only names files that exist
        run: python tools/check_workflow.py

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

      - name: The query arithmetic still holds
        run: python tools/check_laws.py

      - name: Documents still match the measurements
        run: |
          python tools/render_tables.py
          python tools/collect_metrics.py
          python tools/check_numbers.py

      - name: Nothing regenerated differs from what was committed
        run: |
          python tools/render_tables.py
          git diff --exit-code README.md
